# Alembic Configuration File

[alembic]
script_location = alembic

# The sqlalchemy.url is set dynamically by env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[sqlalchemy]
# sqlalchemy-only settings for SQLAlchemy databases
sqlalchemy.echo = False
