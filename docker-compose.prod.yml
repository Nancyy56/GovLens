# Production stack: HTTPS reverse proxy, hardened app container, internal-only databases.
#   cp .env.production.example .env.production   # then fill it in
#   make prod-up
name: govlens-prod

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    image: caddy:2.8-alpine
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      GOVLENS_DOMAIN: ${GOVLENS_DOMAIN:?set GOVLENS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    networks: [edge, internal]

  app:
    <<: *restart
    build: { context: ., dockerfile: Dockerfile }
    image: govlens-app:prod
    environment:
      ENV: production
      DEBUG: "false"
      AUTH_ENABLED: "true"
      LOG_FORMAT: json
      POSTGRES_HOST: postgres
      POSTGRES_DB: govlens
      POSTGRES_USER: govlens_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      HOME: /app/data
      HF_HOME: /app/data/huggingface
    # Migrations run once before the workers start.
    command: sh -c "alembic -c alembic/alembic.ini upgrade head && exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-2} --timeout 120 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100 --access-logfile -"
    volumes:
      - app_data:/app/data
    # Read-only root filesystem; caches and uploads live on the data volume.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Liveness only: readiness also needs the LLM model, which is downloaded after first start.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
      ollama: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 4g }
    # `edge` gives outbound internet (first-run model downloads); nothing is published from it.
    networks: [internal, edge]

  postgres:
    <<: *restart
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: govlens
      POSTGRES_USER: govlens_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govlens_user -d govlens"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.12.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
    volumes: [qdrant_data:/qdrant/storage]
    networks: [internal]

  # Daily database backup; only the newest BACKUP_KEEP files are kept in the `backups` volume.
  # Restore: gunzip -c <file> | docker compose exec -T postgres psql -U govlens_user -d govlens
  backup:
    <<: *restart
    image: postgres:16.4-alpine
    environment:
      PGHOST: postgres
      PGUSER: govlens_user
      PGDATABASE: govlens
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/govlens-$$(date +%Y%m%d-%H%M%S).sql.gz
          if pg_dump --clean --if-exists --no-owner | gzip > "$$f" && gzip -t "$$f"; then
            echo "backup ok: $$f"
          else
            echo "backup FAILED" >&2
          fi
          ls -1t /backups/govlens-*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep 86400
        done
    volumes: [backups:/backups]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  ollama:
    <<: *restart
    image: ollama/ollama:0.5.4
    volumes: [ollama_data:/root/.ollama]
    networks: [internal, edge]

volumes: { caddy_data: {}, caddy_config: {}, app_data: {}, postgres_data: {}, qdrant_data: {}, ollama_data: {}, backups: {} }

networks:
  edge: {}
  internal: { internal: true }
